<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Hearth &amp; Hollow</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18203d"/>
      <stop offset="0.55" stop-color="#34305a"/>
      <stop offset="1" stop-color="#6b4a6c"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f6e6c3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6e6c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm">
      <stop offset="0" stop-color="#ffc861" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff9f43" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="caveClip">
      <path d="M262 432 V376 A58 58 0 0 1 378 376 V432 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#f6e7c8">
    <circle cx="58" cy="62" r="2.5"/>
    <circle cx="132" cy="38" r="2"/>
    <circle cx="96" cy="128" r="2"/>
    <circle cx="214" cy="80" r="2.5"/>
    <circle cx="292" cy="34" r="2"/>
    <circle cx="330" cy="120" r="1.8"/>
    <circle cx="470" cy="176" r="2"/>
    <circle cx="36" cy="200" r="1.8"/>
  </g>

  <!-- moon -->
  <circle cx="404" cy="96" r="80" fill="url(#moonGlow)"/>
  <circle cx="404" cy="96" r="34" fill="#f4e3bf"/>
  <circle cx="392" cy="88" r="6" fill="#e6d1a6"/>
  <circle cx="414" cy="108" r="4" fill="#e6d1a6"/>

  <!-- far hills and pines -->
  <path d="M0 300 C 80 254 156 262 226 290 C 300 252 404 238 512 276 V512 H0 Z" fill="#273a4b"/>
  <g fill="#1f3040">
    <path d="M428 262 L446 214 L464 262 Z"/>
    <path d="M452 266 L472 206 L492 266 Z"/>
    <path d="M30 282 L46 240 L62 282 Z"/>
  </g>

  <!-- chimney smoke -->
  <g fill="none" stroke="#d4cadb" stroke-linecap="round" opacity="0.5">
    <path d="M246 150 C 236 128 262 116 252 94 C 244 76 266 62 260 40" stroke-width="10"/>
  </g>

  <!-- cottage (base sits below the hill line) -->
  <rect x="236" y="156" width="18" height="40" fill="#5b3a2e"/>
  <rect x="232" y="150" width="26" height="9" rx="2" fill="#4a2f26"/>
  <rect x="166" y="198" width="98" height="80" fill="#d8b48a"/>
  <rect x="166" y="198" width="98" height="10" fill="#c39a70"/>
  <path d="M152 204 L215 146 L278 204 Z" fill="#9c3f2f"/>
  <path d="M152 204 L215 146 L222 152 L164 206 Z" fill="#b5523c"/>
  <circle cx="200" cy="232" r="70" fill="url(#warm)"/>
  <rect x="184" y="216" width="34" height="30" rx="3" fill="#ffd27a"/>
  <path d="M201 216 V246 M184 231 H218" stroke="#6b3f2a" stroke-width="4"/>
  <rect x="184" y="216" width="34" height="30" rx="3" fill="none" stroke="#6b3f2a" stroke-width="4"/>
  <rect x="232" y="222" width="20" height="40" rx="3" fill="#6b3f2a"/>
  <circle cx="247" cy="244" r="2" fill="#e9b65b"/>

  <!-- main hill -->
  <path d="M0 344 C 60 300 118 258 204 254 C 318 248 420 290 512 330 V512 H0 Z" fill="#3e6a55"/>
  <path d="M0 344 C 60 300 118 258 204 254 C 318 248 420 290 512 330" fill="none" stroke="#69995f" stroke-width="9" stroke-linecap="round"/>
  <g fill="#2f5546">
    <path d="M410 312 L432 252 L454 312 Z"/>
    <path d="M440 318 L458 270 L476 318 Z"/>
  </g>

  <path d="M242 262 C 246 286 276 290 296 322" fill="none" stroke="#86694b" stroke-width="9" stroke-linecap="round"/>

  <!-- the hollow: cave mouth with lantern and ore -->
  <path d="M262 432 V376 A58 58 0 0 1 378 376 V432 Z" fill="#16111c"/>
  <g clip-path="url(#caveClip)">
    <circle cx="320" cy="378" r="72" fill="url(#warm)"/>
    <rect x="266" y="392" width="12" height="12" fill="#f2a23b"/>
    <rect x="278" y="404" width="10" height="10" fill="#f2a23b"/>
    <rect x="358" y="384" width="12" height="12" fill="#b88be8"/>
    <rect x="346" y="398" width="10" height="10" fill="#b88be8"/>
    <rect x="300" y="414" width="11" height="11" fill="#6ad7d2"/>
  </g>
  <path d="M262 432 V376 A58 58 0 0 1 378 376 V432" fill="none" stroke="#5a5566" stroke-width="10"/>
  <path d="M320 318 V354" stroke="#2b2028" stroke-width="3"/>
  <rect x="311" y="352" width="18" height="6" rx="2" fill="#2b2028"/>
  <rect x="312" y="358" width="16" height="20" rx="3" fill="#ffd27a"/>
  <rect x="311" y="377" width="18" height="5" rx="2" fill="#2b2028"/>

  <!-- deepslate base with ore -->
  <path d="M0 440 C 120 424 390 424 512 440 V512 H0 Z" fill="#2e2c3a"/>
  <path d="M0 476 C 140 466 372 466 512 476 V512 H0 Z" fill="#25232f"/>
  <g>
    <rect x="70" y="452" width="14" height="14" fill="#f2a23b"/>
    <rect x="84" y="466" width="10" height="10" fill="#f2a23b"/>
    <rect x="182" y="484" width="12" height="12" fill="#6ad7d2"/>
    <rect x="416" y="456" width="14" height="14" fill="#b88be8"/>
    <rect x="430" y="470" width="10" height="10" fill="#b88be8"/>
  </g>

  <!-- fireflies -->
  <g fill="#ffe08a">
    <circle cx="110" cy="318" r="3"/>
    <circle cx="146" cy="296" r="2.5"/>
    <circle cx="392" cy="352" r="3"/>
    <circle cx="70" cy="356" r="2.5"/>
  </g>
</svg>
