name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR makes the older run pointless, so PR runs share a group
# and cancel. Each push to main gets a group of its own: GitHub keeps only one
# pending run per group, so a shared group would silently drop a queued main
# run whenever another merge landed behind it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The packwiz commit the pack was built with locally. It has no tagged releases.
  PACKWIZ_VERSION: v0.0.0-20261014010756-170b22d78595

jobs:
  # The PR title becomes the squash commit, and release-please reads only that:
  # a title without a conventional-commit type lands as a subject it does not
  # count, and the change is silently left out of the release.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            build
            ci
            perf

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}
      # index.toml carries a hash of every pack file; a stale one ships the old file.
      - name: index is up to date
        run: |
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml || {
            echo "::error::index.toml is stale. Run 'packwiz refresh' and commit the result."
            exit 1
          }
      - name: export builds
        run: |
          packwiz curseforge export -o pack.zip
          unzip -p pack.zip manifest.json | python3 -c 'import json, sys; m = json.load(sys.stdin); print(m["name"], m["version"], len(m["files"]), "files")'

  # Boots a dedicated server from the built server pack. It catches missing
  # dependencies, version clashes and broken data files, but not client-only mods.
  boot:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Jars are cached by sha1, so a changed mod only downloads that one file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/jars
          key: jars-${{ hashFiles('mods/*.pw.toml') }}
          restore-keys: jars-
      - run: python3 scripts/server_pack.py . build/server --cache .cache/jars
      - run: scripts/boot_test.sh build/server 900
