name: release

# release-please maintains a release PR from the conventional-commit history;
# merging it tags the release, and the publish job below builds the client and
# server packs, attaches them to the GitHub release and uploads them to CurseForge.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  PACKWIZ_VERSION: v0.0.0-20261014010756-170b22d78595

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN and the old behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install github.com/packwiz/packwiz@${PACKWIZ_VERSION}
      # The repo carries "dev" so local test builds can't pass for a release.
      # Better Compatibility Checker shows this version in game.
      - name: stamp version
        run: |
          sed -i "s/^\tmodpackVersion = .*/\tmodpackVersion = \"${VERSION}\"/" config/bcc-common.toml
          grep -q "modpackVersion = \"${VERSION}\"" config/bcc-common.toml
          packwiz refresh
      - name: build packs
        run: |
          mkdir -p dist
          packwiz curseforge export -o "dist/Hearth-and-Hollow-${VERSION}.zip"
          python3 scripts/server_pack.py . build/server
          (cd build/server && zip -qr "../../dist/Hearth-and-Hollow-${VERSION}-server.zip" .)
          ls -la dist
      - name: attach to GitHub release
        run: gh release upload "$TAG" dist/*.zip --clobber
      - name: changelog
        run: gh release view "$TAG" --json body --jq .body > dist/changelog.md
      - name: upload to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 scripts/curseforge_upload.py \
            --project "${{ vars.CURSEFORGE_PROJECT_ID }}" \
            --version "$VERSION" \
            --minecraft "$(sed -n 's/^minecraft = "\(.*\)"/\1/p' pack.toml)" \
            --pack "dist/Hearth-and-Hollow-${VERSION}.zip" \
            --server "dist/Hearth-and-Hollow-${VERSION}-server.zip" \
            --changelog dist/changelog.md \
            --release-type "${{ startsWith(needs.release-please.outputs.version, '0.') && 'beta' || 'release' }}"
